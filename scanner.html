<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odds Room Scanner</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--txt:#e8eaed;--mut:#9aa0aa;--acc:#3b82f6;--w:#22c55e;--d:#a3a3a3;--l:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,sans-serif;padding:16px}
  h1{font-size:20px;margin:0 0 12px}
  .ctl{display:grid;gap:8px;margin-bottom:12px}
  .row{display:flex;gap:8px}
  .row>*{flex:1;min-width:0}
  select,input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--txt);width:100%}
  button{background:var(--acc);border:0;font-weight:600}
  button.sec{background:var(--card);border:1px solid var(--line);font-weight:500}
  .msg{color:var(--mut);font-size:13px;margin:8px 0}
  .err{color:var(--l)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  .hd{font-weight:600;margin-bottom:2px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:8px}
  .team{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  .tn{font-weight:600}
  .form{display:flex;gap:4px;margin:4px 0}
  .f{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#000}
  .W{background:var(--w)}.D{background:var(--d)}.L{background:var(--l)}
  .st{font-size:13px;color:var(--mut)}
  .st b{color:var(--txt);font-weight:600}
  .h2h{font-size:13px;margin-top:8px;color:var(--mut)}
  .btns{display:flex;gap:8px;margin-top:10px}
  .chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mut)}
  .chk input{width:auto}
  .odds{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)}
  .odds b{color:var(--txt);font-weight:600}
  .lgs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .lgs label{display:flex;gap:6px;align-items:center;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
  .lgs input{width:auto;padding:0}
  .sep{height:1px;background:var(--line);margin:8px 0}
  .lh{font-size:17px;font-weight:700;margin:18px 0 8px}
  pre{white-space:pre-wrap;font-size:12px;background:#0b0d11;border:1px solid var(--line);border-radius:8px;padding:10px;margin:0}
</style>
</head>
<body>
<h1>Odds Room Scanner</h1>

<div class="ctl">
  <div class="lgs" id="lgs"></div>
  <div class="row">
    <button class="sec" id="allOn">Vse lige</button>
    <button class="sec" id="allOff">Nobena</button>
  </div>
  <div class="row">
    <button class="sec" id="qToday">Danes</button>
    <button class="sec" id="qTom">Jutri</button>
    <button class="sec" id="q7">7 dni</button>
  </div>
  <div class="row">
    <input type="date" id="d1">
    <input type="date" id="d2">
  </div>
  <label class="chk"><input type="checkbox" id="wo" checked> Kvote (2 kredita na ligo s tekmami)</label>
  <button id="go">Skeniraj izbrane lige</button>
  <button id="cpAll" class="sec" style="display:none">Kopiraj vse za Claude</button>
  <div class="sep"></div>
  <div class="tn">Rezultati</div>
  <input type="date" id="rd">
  <button id="res" class="sec">Prikaži rezultate izbranih lig</button>
  <button id="cpRes" class="sec" style="display:none">Kopiraj rezultate za Claude</button>
</div>

<div id="msg" class="msg"></div>
<div id="out"></div>

<script>
const WORKER = "https://odds-room.oddsroomhq.workers.dev";
const $ = (id) => document.getElementById(id);
let calls = 0, cache = {}, lastText = [], oddsCache = {}, credits = null;
const SPORT = {PL:"soccer_epl",ELC:"soccer_efl_champ",PD:"soccer_spain_la_liga",SA:"soccer_italy_serie_a",BL1:"soccer_germany_bundesliga",FL1:"soccer_france_ligue_one",DED:"soccer_netherlands_eredivisie",PPL:"soccer_portugal_primeira_liga",BSA:"soccer_brazil_campeonato",CL:"soccer_uefa_champs_league"};

const LEAGUES = [["PL","Premier League"],["ELC","Championship"],["PD","La Liga"],["SA","Serie A"],["BL1","Bundesliga"],["FL1","Ligue 1"],["DED","Eredivisie"],["PPL","Primeira Liga"],["BSA","Brasileirão"],["CL","Champions League"]];
$("lgs").innerHTML = LEAGUES.map(([k,n]) => `<label><input type="checkbox" value="${k}" checked> ${n}</label>`).join("");
const sel = () => [...document.querySelectorAll("#lgs input:checked")].map(x => LEAGUES.find(l => l[0] === x.value));
$("allOn").onclick = () => document.querySelectorAll("#lgs input").forEach(x => x.checked = true);
$("allOff").onclick = () => document.querySelectorAll("#lgs input").forEach(x => x.checked = false);

function iso(d){ return d.toLocaleDateString("sv-SE",{timeZone:"Europe/Ljubljana"}); }
const day = (n) => iso(new Date(Date.now() + n*864e5));
function setRange(a, b){ $("d1").value = day(a); $("d2").value = day(b); }
setRange(0, 0); $("rd").value = day(-1);
$("qToday").onclick = () => setRange(0, 0);
$("qTom").onclick = () => setRange(1, 1);
$("q7").onclick = () => setRange(0, 7);

async function api(path){
  calls++;
  let r = await fetch(WORKER + path);
  if (r.status === 429){
    $("msg").textContent = "Omejitev 10 klicev na minuto. Čakam 60 s in nadaljujem...";
    await new Promise(ok => setTimeout(ok, 61000));
    r = await fetch(WORKER + path);
  }
  if (r.status === 429) throw new Error("Preveč klicev. Počakaj 1 minuto.");
  if (!r.ok) throw new Error("Napaka " + r.status + ": " + (await r.text()).slice(0,150));
  return r.json();
}

function fmtDate(u){
  return new Date(u).toLocaleString("sl-SI",{timeZone:"Europe/Ljubljana",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}

async function loadOdds(lg){
  const r = await fetch(`${WORKER}/odds/sports/${SPORT[lg]}/odds?regions=eu&markets=h2h,totals&oddsFormat=decimal`);
  credits = r.headers.get("x-requests-remaining") || credits;
  if (!r.ok) throw new Error("Kvote: napaka " + r.status + ": " + (await r.text()).slice(0,150));
  return r.json();
}

const STOP = new Set(["fc","afc","cf","and","the","club","ac","sc"]);
function toks(s){
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ")
    .split(" ").filter(t => t.length >= 3 && !STOP.has(t));
}
function nameScore(a, b){
  const A = toks(a), B = toks(b); let s = 0;
  for (const x of A) if (B.some(y => y.startsWith(x) || x.startsWith(y))) s++;
  return s;
}
function findEvent(m, events){
  const t = new Date(m.utcDate).getTime();
  let best = null, bs = 0;
  for (const e of events || []){
    if (Math.abs(new Date(e.commence_time).getTime() - t) > 3*3600e3) continue;
    const s = nameScore(m.homeTeam.name + " " + m.homeTeam.shortName, e.home_team)
            + nameScore(m.awayTeam.name + " " + m.awayTeam.shortName, e.away_team);
    if (s > bs){ bs = s; best = e; }
  }
  return bs >= 2 ? best : null;
}

function price(b, mk, name, point){
  return b.markets.find(x => x.key === mk)?.outcomes
    .find(o => o.name === name && (point === undefined || o.point === point))?.price;
}
function fair(arr){ const inv = arr.map(x => 1/x), s = inv.reduce((a,b)=>a+b,0); return inv.map(x => x/s); }
function fairFrom(books, get){
  const pin = books.find(b => b.key === "pinnacle");
  const pp = pin && get(pin);
  if (pp && pp.every(Boolean)) return { p: fair(pp), src: "Pinnacle" };
  const sets = books.map(get).filter(x => x.every(Boolean)).map(fair);
  if (!sets.length) return null;
  return { p: sets[0].map((_, i) => sets.reduce((a, s) => a + s[i], 0) / sets.length), src: `povprečje ${sets.length} stavnic` };
}
function bestOf(books, get){
  let best = null;
  for (const b of books){ const x = get(b); if (x && (!best || x > best.v)) best = { v: x, bk: b.title }; }
  return best;
}
function oddsInfo(e){
  if (!e) return null;
  const B = e.bookmakers, n = [e.home_team, "Draw", e.away_team];
  const f1 = fairFrom(B, b => n.map(x => price(b, "h2h", x)));
  const b1 = n.map(x => bestOf(B, b => price(b, "h2h", x)));
  const ou = ["Over", "Under"];
  const f2 = fairFrom(B, b => ou.map(x => price(b, "totals", x, 2.5)));
  const b2 = ou.map(x => bestOf(B, b => price(b, "totals", x, 2.5)));
  return { f1, b1, f2, b2 };
}
const pc = (p) => Math.round(p*100) + "%";
const fo = (p) => (1/p).toFixed(2);
const bt = (x) => x ? `${x.v.toFixed(2)} ${x.bk}` : "-";
function oddsLines(o){
  if (!o) return ["Kvote: tekma ni najdena pri stavnicah"];
  const L = [];
  if (o.f1) L.push(`1X2 pošteno (${o.f1.src}): 1 ${pc(o.f1.p[0])} (${fo(o.f1.p[0])}) | X ${pc(o.f1.p[1])} (${fo(o.f1.p[1])}) | 2 ${pc(o.f1.p[2])} (${fo(o.f1.p[2])})`);
  L.push(`1X2 najboljše: 1 ${bt(o.b1[0])} | X ${bt(o.b1[1])} | 2 ${bt(o.b1[2])}`);
  if (o.f2) L.push(`O/U 2.5 pošteno (${o.f2.src}): Over ${pc(o.f2.p[0])} (${fo(o.f2.p[0])}) | Under ${pc(o.f2.p[1])} (${fo(o.f2.p[1])})`);
  else L.push("O/U 2.5: ni linije 2.5");
  if (o.f2) L.push(`O/U 2.5 najboljše: Over ${bt(o.b2[0])} | Under ${bt(o.b2[1])}`);
  return L;
}

function teamStats(finished, id, venue){
  let ms = finished.filter(m => m.homeTeam.id === id || m.awayTeam.id === id);
  if (venue === "H") ms = ms.filter(m => m.homeTeam.id === id);
  if (venue === "A") ms = ms.filter(m => m.awayTeam.id === id);
  const rows = ms.map(m => {
    const home = m.homeTeam.id === id;
    const gf = home ? m.score.fullTime.home : m.score.fullTime.away;
    const ga = home ? m.score.fullTime.away : m.score.fullTime.home;
    const opp = home ? m.awayTeam.shortName : m.homeTeam.shortName;
    return { date:m.utcDate.slice(0,10), gf, ga, opp, ha: home ? "D" : "G",
             res: gf>ga ? "W" : gf<ga ? "L" : "D", tot: gf+ga, btts: gf>0 && ga>0 };
  });
  const n = rows.length || 1;
  return {
    rows,
    last5: rows.slice(-5).reverse(),
    n: rows.length,
    gf: (rows.reduce((s,r)=>s+r.gf,0)/n).toFixed(2),
    ga: (rows.reduce((s,r)=>s+r.ga,0)/n).toFixed(2),
    o25: Math.round(rows.filter(r=>r.tot>2).length/n*100),
    btts: Math.round(rows.filter(r=>r.btts).length/n*100),
  };
}

function formHtml(last5){
  return '<div class="form">' + last5.map(r => `<span class="f ${r.res}">${r.res}</span>`).join("") + "</div>";
}
function formTxt(last5){
  return last5.map(r => `${r.res} ${r.gf}:${r.ga} ${r.opp} (${r.ha})`).join(", ");
}
function statLine(s){
  return `${s.n} tekem | goli ${s.gf}/${s.ga} | O2.5 ${s.o25}% | BTTS ${s.btts}%`;
}

function render(lgName, upcoming, finished, events){
  const lh = document.createElement("div"); lh.className = "lh"; lh.textContent = `${lgName} (${upcoming.length})`;
  $("out").appendChild(lh);
  upcoming.forEach((m) => {
    const i = lastText.length;
    const h = m.homeTeam, a = m.awayTeam;
    const hs = teamStats(finished, h.id), as = teamStats(finished, a.id);
    const hh = teamStats(finished, h.id, "H"), aa = teamStats(finished, a.id, "A");
    const ol = events ? oddsLines(oddsInfo(findEvent(m, events))) : [];
    const txt =
`${lgName} | ${fmtDate(m.utcDate)} | ${h.shortName} vs ${a.shortName}
${h.shortName} forma (najnovejša prva): ${formTxt(hs.last5) || "ni podatkov"}
${h.shortName} sezona: ${statLine(hs)}
${h.shortName} doma: ${statLine(hh)}
${a.shortName} forma (najnovejša prva): ${formTxt(as.last5) || "ni podatkov"}
${a.shortName} sezona: ${statLine(as)}
${a.shortName} v gosteh: ${statLine(aa)}` + (ol.length ? "\n" + ol.join("\n") : "");
    lastText[i] = txt;

    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `
      <div class="hd">${h.shortName} vs ${a.shortName}</div>
      <div class="sub">${fmtDate(m.utcDate)} · krog ${m.matchday ?? "-"}</div>
      <div class="team"><div class="tn">${h.shortName}</div>${formHtml(hs.last5)}
        <div class="st">Sezona: <b>${statLine(hs)}</b></div>
        <div class="st">Doma: <b>${statLine(hh)}</b></div></div>
      <div class="team"><div class="tn">${a.shortName}</div>${formHtml(as.last5)}
        <div class="st">Sezona: <b>${statLine(as)}</b></div>
        <div class="st">V gosteh: <b>${statLine(aa)}</b></div></div>
      ${ol.length ? `<div class="odds">${ol.map(l => l.replace(/^([^:]+):/, "<b>$1:</b>")).join("<br>")}</div>` : ""}
      <div class="h2h" id="h2h${i}"></div>
      <div class="h2h" id="lu${i}"></div>
      <div class="btns">
        <button class="sec" id="hb${i}">H2H</button>
        <button class="sec" id="lb${i}">Postave</button>
        <button class="sec" id="cb${i}">Kopiraj</button>
      </div>`;
    $("out").appendChild(c);
    $("cb"+i).onclick = () => copy(lastText[i], $("cb"+i));
    $("hb"+i).onclick = () => loadH2H(m.id, i);
    $("lb"+i).onclick = () => loadLineups(m, i);
  });
}

async function loadH2H(id, i){
  const box = $("h2h"+i);
  box.textContent = "Nalagam H2H...";
  try{
    const d = await api(`/matches/${id}/head2head?limit=5`);
    const ms = (d.matches || []).filter(m => m.status === "FINISHED");
    if (!ms.length){ box.textContent = "H2H: ni podatkov."; return; }
    const lines = ms.map(m => `${m.utcDate.slice(0,10)} ${m.homeTeam.shortName} ${m.score.fullTime.home}:${m.score.fullTime.away} ${m.awayTeam.shortName}`);
    box.innerHTML = "<b>H2H:</b><br>" + lines.join("<br>");
    lastText[i] = lastText[i].replace(/\nH2H:[^\n]*/, "") + "\nH2H: " + lines.join("; ");
    $("msg").textContent = `Klici danes v tej seji: ${calls}`;
  }catch(e){ box.innerHTML = `<span class="err">${e.message}</span>`; }
}

// ---- Postave (Highlightly, brezplačno 100 klicev na dan) ----
let hlCalls = 0;
const hlDays = {}, hlLineups = {};
async function hl(path){
  hlCalls++;
  const r = await fetch(WORKER + "/hl" + path);
  if (r.status === 404) return null;
  if (r.status === 429) throw new Error("Highlightly: dnevna omejitev porabljena (100 klicev).");
  if (!r.ok) throw new Error("Highlightly napaka " + r.status + ": " + (await r.text()).slice(0,150));
  return r.json();
}
const HL_NAME = {PL:"Premier League",ELC:"Championship",PD:"La Liga",SA:"Serie A",BL1:"Bundesliga",FL1:"Ligue 1",DED:"Eredivisie",PPL:"Primeira Liga",BSA:"Serie A",CL:"UEFA Champions League"};
async function hlDay(d, lg){
  const key = d + (lg ? "|" + lg : "");
  if (hlDays[key]) return hlDays[key];
  const flt = lg && HL_NAME[lg] ? "&leagueName=" + encodeURIComponent(HL_NAME[lg]) : "";
  const all = [];
  for (let off = 0, page = 0; page < (flt ? 3 : 8); page++, off += 100){
    const j = await hl(`/football/matches?date=${d}${flt}&limit=100&offset=${off}`);
    const data = (j && j.data) || [];
    all.push(...data);
    const tot = j && j.pagination && j.pagination.totalCount;
    if (data.length < 100 || (tot && all.length >= tot)) break;
  }
  return (hlDays[key] = all);
}
function findHl(m, list){
  const t = new Date(m.utcDate).getTime();
  let best = null, bs = 0;
  for (const e of list){
    if (Math.abs(new Date(e.date).getTime() - t) > 3*3600e3) continue;
    const s = nameScore(m.homeTeam.name + " " + m.homeTeam.shortName, e.homeTeam?.name || "")
            + nameScore(m.awayTeam.name + " " + m.awayTeam.shortName, e.awayTeam?.name || "");
    if (s > bs){ bs = s; best = e; }
  }
  return bs >= 2 ? best : null;
}
function luTeam(t){
  if (!t || !t.initialLineup || !t.initialLineup.length) return null;
  const xi = t.initialLineup.map(row => (Array.isArray(row) ? row : [row]).map(p => p.name).join(", ")).join(" | ");
  const subs = (t.substitutes || []).map(p => p.name).join(", ");
  return { f: t.formation || "?", xi, subs };
}
async function loadLineups(m, i){
  const box = $("lu"+i);
  box.textContent = "Nalagam postave...";
  try{
    const d = m.utcDate.slice(0,10);
    if (!hlLineups[m.id]){
      const lg = m.competition?.code || m._lg;
      let e = findHl(m, await hlDay(d, lg));
      if (!e && lg) e = findHl(m, await hlDay(d));
      if (!e){ box.textContent = "Postave: tekme ni v Highlightly."; return; }
      const j = await hl(`/football/lineups/${e.id}`);
      hlLineups[m.id] = j && (j.homeTeam ? j : j.data) || {};
    }
    const L = hlLineups[m.id], h = luTeam(L.homeTeam), a = luTeam(L.awayTeam);
    if (!h && !a){
      delete hlLineups[m.id];
      box.textContent = "Postave še niso objavljene. Pridejo približno 30–60 min pred tekmo.";
    } else {
      const ln = (nm, x) => x ? `${nm} (${x.f}): ${x.xi}` + (x.subs ? ` · Klop: ${x.subs}` : "") : `${nm}: ni podatka`;
      const t1 = ln(m.homeTeam.shortName, h), t2 = ln(m.awayTeam.shortName, a);
      box.innerHTML = "<b>Postave:</b><br>" + [t1, t2].map(s => s.replace(/</g,"&lt;")).join("<br>");
      lastText[i] = lastText[i].replace(/\nPostave:[^\n]*/, "") + "\nPostave: " + t1 + " || " + t2;
    }
    $("msg").textContent = `Highlightly klici v tej seji: ${hlCalls} (dnevno 100)`;
  }catch(e){ box.innerHTML = `<span class="err">${e.message}</span>`; }
}

function copy(t, btn){
  const done = () => { const o = btn.textContent; btn.textContent = "Kopirano ✓"; setTimeout(()=>btn.textContent=o, 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => fallback(t, done));
  else fallback(t, done);
}
function fallback(t, done){
  const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta);
  ta.select(); document.execCommand("copy"); ta.remove(); done();
}

// local-time window [d1 00:00, d2 24:00) Ljubljana
function inRange(u, d1, d2){ const d = iso(new Date(u)); return d >= d1 && d <= d2; }

async function getLeague(lg){
  if (!cache[lg]) cache[lg] = await api(`/competitions/${lg}/matches`);
  return cache[lg].matches || [];
}

$("go").onclick = async () => {
  const lgs = sel(), d1 = $("d1").value, d2 = $("d2").value;
  $("msg").className = "msg"; $("out").innerHTML = ""; lastText = []; $("cpAll").style.display = "none";
  if (!lgs.length){ $("msg").textContent = "Izberi vsaj eno ligo."; return; }
  let total = 0, errs = [], used = [];
  for (const [lg, lgName] of lgs){
    $("msg").textContent = `Nalagam ${lgName}...`;
    try{
      const all = await getLeague(lg);
      const finished = all.filter(m => m.status === "FINISHED").sort((a,b)=>a.utcDate.localeCompare(b.utcDate));
      const upcoming = all.filter(m => !["FINISHED","CANCELLED","AWARDED","IN_PLAY","PAUSED"].includes(m.status)
        && inRange(m.utcDate, d1, d2)).sort((a,b)=>a.utcDate.localeCompare(b.utcDate));
      if (!upcoming.length) continue;
      upcoming.forEach(m => m._lg = lg);
      let events = null;
      if ($("wo").checked){
        try{ if (!oddsCache[lg]){ oddsCache[lg] = await loadOdds(lg); used.push(lgName); } events = oddsCache[lg]; }
        catch(e){ errs.push(lgName + " kvote: " + e.message); }
      }
      render(lgName, upcoming, finished, events);
      total += upcoming.length;
    }catch(e){ errs.push(lgName + ": " + e.message); }
  }
  if (!total) $("out").innerHTML = '<div class="msg">V tem obdobju ni tekem v izbranih ligah.</div>';
  $("msg").className = errs.length ? "msg err" : "msg";
  $("msg").textContent = `${total} tekem · Klici: ${calls}` + (credits ? ` · Krediti za kvote: ${credits}` : "")
    + (used.length ? ` · Kvote naložene: ${used.join(", ")}` : "") + (errs.length ? " · " + errs.join(" · ") : "");
  if (total) $("cpAll").style.display = "block";
};

let resText = "";
$("res").onclick = async () => {
  const lgs = sel(), d = $("rd").value;
  $("msg").className = "msg"; $("out").innerHTML = ""; $("cpRes").style.display = "none";
  if (!lgs.length){ $("msg").textContent = "Izberi vsaj eno ligo."; return; }
  const out = [], errs = [];
  for (const [lg, lgName] of lgs){
    $("msg").textContent = `Nalagam ${lgName}...`;
    try{
      delete cache[lg]; // vedno sveži rezultati
      const ms = (await getLeague(lg)).filter(m => inRange(m.utcDate, d, d)).sort((a,b)=>a.utcDate.localeCompare(b.utcDate));
      if (!ms.length) continue;
      out.push(`${lgName}:`);
      for (const m of ms){
        const ft = m.score.fullTime, ht = m.score.halfTime;
        const t = new Date(m.utcDate).toLocaleTimeString("sl-SI",{timeZone:"Europe/Ljubljana",hour:"2-digit",minute:"2-digit"});
        if (m.status === "FINISHED")
          out.push(`${t} ${m.homeTeam.shortName} ${ft.home}:${ft.away} ${m.awayTeam.shortName}` + (ht && ht.home !== null ? ` (pol. ${ht.home}:${ht.away})` : ""));
        else out.push(`${t} ${m.homeTeam.shortName} vs ${m.awayTeam.shortName}: ${m.status === "IN_PLAY" || m.status === "PAUSED" ? "v teku" : "ni končana (" + m.status + ")"}`);
      }
      out.push("");
    }catch(e){ errs.push(lgName + ": " + e.message); }
  }
  resText = out.length ? `Rezultati ${d}\n\n` + out.join("\n").trim() : "";
  $("out").innerHTML = resText ? `<pre>${resText.replace(/</g,"&lt;")}</pre>` : '<div class="msg">Ta dan ni tekem v izbranih ligah.</div>';
  $("msg").className = errs.length ? "msg err" : "msg";
  $("msg").textContent = `Klici: ${calls}` + (errs.length ? " · " + errs.join(" · ") : "");
  if (resText) $("cpRes").style.display = "block";
};
$("cpRes").onclick = () => copy(resText, $("cpRes"));

$("cpAll").onclick = () => copy(lastText.join("\n\n"), $("cpAll"));
